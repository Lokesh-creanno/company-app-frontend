server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache immutable Flutter assets
  location ~* \.(js|wasm|otf|ttf|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Never cache index.html — new deploys instantly visible
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }

  # /api/* → CREANNO backend service via Coolify Traefik (public sslip.io URL).
  # Two hops (nginx -> traefik -> backend) but no service-alias guessing needed.
  # If moving backend elsewhere, update this proxy_pass.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $backend_upstream "http://nujz2qd20b7nkvwohw6yfgky.172.105.48.130.sslip.io";
  location /api/ {
    proxy_pass         $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              nujz2qd20b7nkvwohw6yfgky.172.105.48.130.sslip.io;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback — every non-file route serves index.html for go_router deep links
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;
}
